name: Android app

on:
  push:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk health-twin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: health-twin-apk
          path: mobile/android/health-twin.apk
      - name: Publish the APK as a public release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest health-twin.apk \
            --title "Health Twin Android app (latest build)" \
            --notes "Install on Android 8+ with Health Connect. Built automatically from commit ${GITHUB_SHA::7}. See docs/mobile.md." \
            --target "$GITHUB_SHA"
